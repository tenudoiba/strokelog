<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Strokelog - walk through the gallery</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--wall:#fff;--floor:#E6E6EA;--frame:#17171A;--mat:#fff;--ink:#17171A;--mute:#74747E;--line:#D9D9DF;--pencil:#F2B705;--field:#F4F4F7}
@media (prefers-color-scheme:dark){:root{--wall:#202026;--floor:#14141A;--frame:#0B0B0E;--ink:#F1F1F4;--mute:#A0A0AC;--line:#34343C;--field:#2A2A32}}
*{box-sizing:border-box}
body{margin:0;background:var(--wall);color:var(--ink);font-family:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:300;line-height:1.5;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pencil);outline-offset:3px}
header{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-weight:600;letter-spacing:.02em}
nav{display:flex;gap:16px;font-size:.92rem}
nav button{text-decoration:underline;text-underline-offset:4px}
.crumb{padding:6px 24px 0;color:var(--mute);font-size:.9rem}
.crumb button{text-decoration:underline;text-underline-offset:3px}
.intro{padding:40px 24px 8px;max-width:620px}
.intro h1{font-weight:300;font-size:clamp(1.9rem,6vw,3rem);line-height:1.15;margin:0 0 12px}
.intro p{color:var(--mute);margin:0;max-width:44ch}
.hall{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:28px;border-bottom:36px solid var(--floor)}
.wall{flex:0 0 min(86vw,560px);scroll-snap-align:center;padding:40px 28px 36px;min-height:420px;display:flex;flex-direction:column;justify-content:space-between}
.hang{display:flex;align-items:flex-end;justify-content:center;gap:26px;flex:1;padding-bottom:28px}
.frame{display:block;border:5px solid var(--frame);background:var(--mat);padding:12px;box-shadow:0 10px 18px -12px rgba(0,0,0,.45)}
.frame img{display:block;width:100%;height:auto}
.hang .frame:nth-child(1){width:46%}
.hang .frame:nth-child(2){width:34%;margin-bottom:60px}
.hang .frame:nth-child(3){width:26%}
.plaque{border-left:2px solid var(--ink);padding-left:12px}
.plaque b{font-weight:600;display:block}
.plaque span{color:var(--mute);font-size:.9rem}
.link{text-decoration:underline;text-underline-offset:4px;font-size:.92rem;display:inline-block;margin-top:8px}
.hint,.empty{padding:14px 24px;color:var(--mute);font-size:.9rem}
.room,.piece,.form{padding:32px 24px 0;margin:0 auto}
.room{max-width:1000px}.piece{max-width:760px}.form{max-width:560px}
h2{font-weight:300;font-size:clamp(1.6rem,5vw,2.5rem);margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 40px}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:64px 44px;padding-bottom:64px}
.work .frame{margin-bottom:14px}
.piece .frame{margin:0 auto 22px;max-width:620px}
.seal{display:inline-block;margin-top:12px;border:1px solid var(--ink);padding:3px 10px;font-size:.85rem;font-weight:600}
.seal i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pencil);margin-right:7px}
.walk{margin:40px 0 0;padding:0;list-style:none}
.walk li{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:22px 0;border-top:1px solid var(--line)}
.walk .n{width:44px;height:44px;border:1px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:600}
.walk img,.walk video{display:block;max-width:100%;width:340px;margin-top:10px;border:1px solid var(--line)}
label{display:block;margin:18px 0 6px;font-weight:600;font-size:.92rem}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);background:var(--field);border-radius:4px}
.btn{display:inline-block;background:var(--ink);color:var(--wall);padding:12px 22px;margin-top:22px;border-radius:4px;font-weight:600}
.btn[disabled]{opacity:.5}
.ghost{border:1px solid var(--ink);background:none;color:var(--ink);padding:8px 14px;margin-top:12px;border-radius:4px}
.stage{border-top:1px solid var(--line);margin-top:18px;padding-top:4px}
.msg{margin-top:16px;color:var(--mute)}
.err{color:#C2362B;font-weight:600}
.foot{height:60px}
</style>
</head>
<body>
<header><span class="brand">Strokelog</span><nav id="nav"></nav></header>
<div class="crumb" id="crumb"></div>
<main id="view"></main>
<div class="foot"></div>
<script>
var SUPABASE_URL="https://znxegkynyzvdubsstgtf.supabase.co";
var SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpueGVna3lueXp2ZHVic3N0Z3RmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MTM5NDIsImV4cCI6MjEwNzI4OTk0Mn0.fZZ0654rQIgX2PlGUYFNTwjL_mAnzYPARcCFoLhFCZg";
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var view=document.getElementById("view"),crumb=document.getElementById("crumb"),nav=document.getElementById("nav");
var user=null,artists=[];
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function url(p){return sb.storage.from("art").getPublicUrl(p).data.publicUrl}
function frame(p,alt){return '<span class="frame"><img src="'+esc(url(p))+'" alt="'+esc(alt)+'" loading="lazy"></span>'}
function isVideo(p){return /\.(mp4|webm|mov|m4v)$/i.test(p)}
function media(p,n){var u=esc(url(p));return isVideo(p)?'<video src="'+u+'" controls playsinline preload="metadata"></video>':'<img src="'+u+'" alt="Stage '+(n+1)+'" loading="lazy">'}
function setCrumb(parts){crumb.innerHTML="";parts.forEach(function(p,i){
  if(i)crumb.appendChild(document.createTextNode(" / "));
  if(p.fn){var b=document.createElement("button");b.textContent=p.t;b.onclick=p.fn;crumb.appendChild(b)}else crumb.appendChild(document.createTextNode(p.t));
})}
function drawNav(){
  nav.innerHTML="";
  function add(t,fn){var b=document.createElement("button");b.textContent=t;b.onclick=fn;nav.appendChild(b)}
  add("Gallery",hall);
  if(user){add("Upload art",uploadForm);add("Log out",function(){sb.auth.signOut().then(function(){user=null;drawNav();hall()})})}
  else add("Artist log in",authForm);
}
function load(){
  return Promise.all([
    sb.from("profiles").select("*"),
    sb.from("artworks").select("*").order("created_at",{ascending:false}),
    sb.from("stages").select("*").order("position")
  ]).then(function(r){
    if(r[0].error||r[1].error||r[2].error)throw (r[0].error||r[1].error||r[2].error);
    artists=r[0].data.map(function(p){
      p.works=r[1].data.filter(function(a){return a.artist_id===p.id}).map(function(a){
        a.steps=r[2].data.filter(function(s){return s.artwork_id===a.id});return a});
      return p}).filter(function(p){return p.works.length});
  });
}
function hall(){
  setCrumb([]);view.innerHTML='<p class="empty">Loading the gallery...</p>';
  load().then(function(){
    var intro='<div class="intro"><h1>Walk through. Every piece shows how it was made.</h1><p>Swipe along the wall, step into an artist\'s room, then follow a piece from first line to finished work.</p></div>';
    if(!artists.length){view.innerHTML=intro+'<p class="empty">The walls are empty for now. The first artists are on their way.</p>';return}
    var w=artists.map(function(a,idx){
      var f=a.works.slice(0,3).map(function(k){return '<button data-a="'+idx+'" aria-label="Enter '+esc(a.display_name)+'\'s room">'+frame(k.image_path,k.title)+'</button>'}).join("");
      return '<section class="wall"><div class="hang">'+f+'</div><div class="plaque"><b>'+esc(a.display_name)+'</b><span>'+esc(a.city||"")+(a.city?", ":"")+a.works.length+' work'+(a.works.length>1?'s':'')+' with process</span><br><button class="link" data-a="'+idx+'">Enter the room</button></div></section>';
    }).join("");
    view.innerHTML=intro+'<div class="hall" tabindex="0" aria-label="Gallery hall, scroll sideways">'+w+'</div><p class="hint">Swipe sideways to walk to the next artist.</p>';
    view.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){room(+b.dataset.a)}});
    window.scrollTo(0,0);
  }).catch(function(e){view.innerHTML='<p class="empty err">Could not load the gallery. '+esc(e.message||e)+'</p>'});
}
function room(i){
  var a=artists[i];setCrumb([{t:"Gallery",fn:hall},{t:a.display_name}]);
  var w=a.works.map(function(k,j){return '<div class="work"><button data-w="'+j+'" aria-label="Open '+esc(k.title)+'">'+frame(k.image_path,k.title)+'</button><div class="plaque"><b>'+esc(k.title)+'</b><span>'+esc(k.medium||"")+', '+k.steps.length+' stage'+(k.steps.length===1?'':'s')+'</span></div></div>'}).join("");
  view.innerHTML='<div class="room"><h2>'+esc(a.display_name)+'</h2><p class="sub">'+esc(a.city||"")+'</p><div class="works">'+w+'</div></div>';
  view.querySelectorAll("[data-w]").forEach(function(b){b.onclick=function(){piece(i,+b.dataset.w)}});
  window.scrollTo(0,0);
}
function piece(i,j){
  var a=artists[i],k=a.works[j];
  setCrumb([{t:"Gallery",fn:hall},{t:a.display_name,fn:function(){room(i)}},{t:k.title}]);
  var s=k.steps.map(function(t,n){return '<li><span class="n">'+(n+1)+'</span><div><b>Stage '+(n+1)+'</b><br>'+esc(t.note||"")+media(t.image_path,n)+'</div></li>'}).join("");
  view.innerHTML='<div class="piece">'+frame(k.image_path,k.title)+'<div class="plaque"><b style="font-size:1.1rem">'+esc(k.title)+'</b><span>'+esc(a.display_name)+', '+esc((k.medium||"").toLowerCase())+'</span></div>'+(k.steps.length?'<span class="seal"><i></i>Process verified</span><ol class="walk">'+s+'</ol>':'')+'</div>';
  window.scrollTo(0,0);
}
/* sign up and log in */
function authForm(mode){
  mode=mode==="up"?"up":"in";setCrumb([{t:"Gallery",fn:hall},{t:mode==="up"?"Artist sign up":"Artist log in"}]);
  view.innerHTML='<div class="form"><h2>'+(mode==="up"?"Join as an artist":"Welcome back")+'</h2><p class="sub">'+(mode==="up"?"Create your wall in the gallery.":"Log in to upload your art.")+'</p>'+
  (mode==="up"?'<label for="dn">Artist name</label><input id="dn" autocomplete="name"><label for="ct">City</label><input id="ct" placeholder="Lagos">':'')+
  '<label for="em">Email</label><input id="em" type="email" autocomplete="email"><label for="pw">Password (6 or more characters)</label><input id="pw" type="password" autocomplete="'+(mode==="up"?"new-password":"current-password")+'">'+
  '<button class="btn" id="go">'+(mode==="up"?"Create account":"Log in")+'</button><div class="msg" id="msg"></div><button class="link" id="sw">'+(mode==="up"?"I already have an account":"New here? Sign up as an artist")+'</button></div>';
  document.getElementById("sw").onclick=function(){authForm(mode==="up"?"in":"up")};
  document.getElementById("go").onclick=function(){
    var m=document.getElementById("msg"),b=this,em=document.getElementById("em").value.trim(),pw=document.getElementById("pw").value;
    m.className="msg";m.textContent="One moment...";b.disabled=true;
    var p;
    if(mode==="up"){
      var dn=document.getElementById("dn").value.trim();
      if(!dn){m.className="msg err";m.textContent="Please enter your artist name.";b.disabled=false;return}
      p=sb.auth.signUp({email:em,password:pw,options:{data:{display_name:dn,city:document.getElementById("ct").value.trim()}}});
    }else p=sb.auth.signInWithPassword({email:em,password:pw});
    p.then(function(r){
      if(r.error)throw r.error;
      if(!r.data.session){m.textContent="Check your email to confirm your account, then log in.";b.disabled=false;return}
      return startSession(r.data.session.user).then(uploadForm);
    }).catch(function(e){m.className="msg err";m.textContent=e.message||String(e);b.disabled=false});
  };
}
function startSession(u){
  user=u;drawNav();
  return sb.from("profiles").select("id").eq("id",u.id).then(function(r){
    if(r.data&&r.data.length)return;
    var md=u.user_metadata||{};
    return sb.from("profiles").insert({id:u.id,display_name:md.display_name||(u.email||"Artist").split("@")[0],city:md.city||null});
  });
}
/* upload */
function shrink(file){
  return new Promise(function(res,rej){
    var img=new Image(),r=new FileReader();
    r.onload=function(){img.onload=function(){
      var max=1600,s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(function(b){res(b||file)},"image/jpeg",0.85)};img.onerror=function(){rej(new Error("That photo cannot be read. Please pick a normal JPG or PNG photo."))};img.src=r.result};
    r.onerror=function(){res(file)};r.readAsDataURL(file);
  });
}
function put(file){
  var v=file.type.indexOf("video/")===0;
  var job=v?Promise.resolve({blob:file,ext:({"video/mp4":"mp4","video/webm":"webm","video/quicktime":"mov"})[file.type]||"mp4",type:file.type||"video/mp4"}):shrink(file).then(function(b){return{blob:b,ext:"jpg",type:"image/jpeg"}});
  return job.then(function(o){
    var path=user.id+"/"+crypto.randomUUID()+"."+o.ext;
    return sb.storage.from("art").upload(path,o.blob,{contentType:o.type}).then(function(r){if(r.error)throw r.error;return path});
  });
}
function uploadForm(){
  if(!user){authForm("in");return}
  setCrumb([{t:"Gallery",fn:hall},{t:"Upload art"}]);
  view.innerHTML='<div class="form"><h2>Add a piece</h2><p class="sub">Upload the finished work, then the photos that show how you made it.</p>'+
  '<label for="tt">Title</label><input id="tt"><label for="md">Medium</label><select id="md"><option>Sketch</option><option>Painting</option></select>'+
  '<label for="fin">Finished piece (photo)</label><input id="fin" type="file" accept="image/*">'+
  '<h2 style="font-size:1.3rem;margin-top:32px">Process stages</h2><div id="stages"></div><button class="ghost" id="add">Add a stage</button>'+
  '<button class="btn" id="pub">Publish to the gallery</button><div class="msg" id="msg"></div></div>';
  var box=document.getElementById("stages");
  function addStage(){var d=document.createElement("div");d.className="stage";d.innerHTML='<label>Stage photo or short video</label><input type="file" accept="image/*,video/*" class="sf"><label>What did you do here?</label><input class="sn" placeholder="e.g. Light pencil outline">';box.appendChild(d)}
  addStage();document.getElementById("add").onclick=addStage;
  document.getElementById("pub").onclick=function(){
    var b=this,m=document.getElementById("msg"),title=document.getElementById("tt").value.trim(),fin=document.getElementById("fin").files[0];
    var st=[].slice.call(box.querySelectorAll(".stage")).map(function(d){return{f:d.querySelector(".sf").files[0],n:d.querySelector(".sn").value.trim()}}).filter(function(x){return x.f});
    m.className="msg";
    if(!title||!fin){m.className="msg err";m.textContent="Please add a title and the finished photo.";return}
    if(!st.length){m.className="msg err";m.textContent="Add at least one process stage. The process is what makes your piece verified.";return}
    var big=st.concat([{f:fin}]).filter(function(x){return x.f.size>30*1024*1024})[0];
    if(big){m.className="msg err";m.textContent="One file is over 30 MB. Please use a shorter clip (under about 1 minute) or a smaller photo.";return}
    b.disabled=true;m.textContent="Uploading, please keep this page open...";
    var aid=crypto.randomUUID();
    put(fin).then(function(fp){
      return sb.from("artworks").insert({id:aid,artist_id:user.id,title:title,medium:document.getElementById("md").value,image_path:fp}).then(function(r){if(r.error)throw r.error});
    }).then(function(){
      return st.reduce(function(chain,x,i){return chain.then(function(){m.textContent="Uploading stage "+(i+1)+" of "+st.length+"...";
        return put(x.f).then(function(p){return sb.from("stages").insert({artwork_id:aid,position:i+1,note:x.n,image_path:p}).then(function(r){if(r.error)throw r.error})})})},Promise.resolve());
    }).then(function(){m.textContent="Published!";hall()})
    .catch(function(e){m.className="msg err";m.textContent="Something went wrong: "+(e.message||e);b.disabled=false});
  };
}
sb.auth.getSession().then(function(r){
  var p=r.data&&r.data.session?startSession(r.data.session.user):Promise.resolve();
  p.then(function(){drawNav();hall()});
});
</script>
</body>
</html>
